name: Windows build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore BAM.slnx --locked-mode
      - run: dotnet build BAM.slnx -c Release --no-restore
      - run: dotnet test BAM.slnx -c Release --no-build --no-restore

  package-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Package Windows x64 portable build
        shell: pwsh
        run: ./scripts/Publish-Portable.ps1 -OutputDirectory artifacts/release
      - name: Publish verified GitHub release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.Substring(1)
          $zip = "BAM-$version-win-x64.zip"
          $alpha = $version -match '-alpha\.'
          $flags = @()
          if ($alpha) { $flags += '--prerelease' }
          gh release create "$tag" "artifacts/release/$zip" "artifacts/release/$zip.sha256" `
            --verify-tag --draft @flags --title "BAM $version (Windows x64)" --notes-file "docs/releases/$tag.md"
          $draft = gh release view "$tag" --json isDraft,isPrerelease,assets | ConvertFrom-Json
          if (-not $draft.isDraft -or $draft.isPrerelease -ne $alpha -or
              $draft.assets.Count -ne 2 -or @(Compare-Object @($zip, "$zip.sha256") @($draft.assets.name)).Count -ne 0 -or
              ($draft.assets | Where-Object { $_.size -le 0 -or $_.state -ne 'uploaded' })) {
            throw 'Draft assets did not pass verification.'
          }
          $download = Join-Path $env:RUNNER_TEMP 'bam-release-check'
          gh release download "$tag" --dir "$download" --pattern "$zip*"
          $expected = (Get-Content -LiteralPath (Join-Path $download "$zip.sha256") -Raw).Trim().Split(' ')[0]
          if ((Get-FileHash -LiteralPath (Join-Path $download $zip) -Algorithm SHA256).Hash -ne $expected -or
              (Get-FileHash -LiteralPath "artifacts/release/$zip" -Algorithm SHA256).Hash -ne $expected) {
            throw 'Uploaded ZIP digest did not match the local package and checksum.'
          }
          gh release edit "$tag" --draft=false @flags
